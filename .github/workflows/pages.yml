# Baut die App bei jedem Push auf main, prüft sie und veröffentlicht sie auf GitHub Pages:
# https://youra82.github.io/motion_arena/
name: App veröffentlichen (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typprüfung
        run: pnpm typecheck
      - name: Unit-Tests
        run: pnpm test
      - name: Bauen (Unterpfad /motion_arena/)
        run: pnpm build
        env:
          BASE_PATH: /motion_arena/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/mobile-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
